apiVersion: v1
kind: PersistentVolume
metadata:
  name: vprofile-pv
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: /data/mysql
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vprofile-pvc
  namespace: vprofile
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi