apiVersion: apps/v1
kind: Deployment
metadata:
  name: vprofile-memcached
  namespace: vprofile

spec:
  replicas: 1

  selector:
    matchLabels:
      app: vprofile-memcached

  template:
    metadata:
      labels:
        app: vprofile-memcached

    spec:
      containers:
        - name: memcached
          image: memcached:1.6
          ports:
            - containerPort: 11211

          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "200m"