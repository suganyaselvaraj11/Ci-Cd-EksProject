apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: devops
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
     containers:
        - name: app
          image: sakthisuganya/ci-cd-eksproject:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080